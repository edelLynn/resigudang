  <!-- Door -->
  <rect x="20" y="28" width="8" height="10" rx="1" fill="#13ec37" opacity="0.7"/>
  <!-- Left window -->
  <rect x="13" y="24" width="5" height="5" rx="1" fill="#13ec37" opacity="0.5"/>
  <!-- Right window -->
