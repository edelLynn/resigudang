      <stop offset="0%" stop-color="#13ec37"/>
      <stop offset="100%" stop-color="#0a9e25"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Warehouse icon (simplified) -->
